<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competition Math Reference</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="nav-toggle" id="nav-toggle" aria-label="Open section menu" title="Browse sections">&#9776;</button>

        <kbd class="search-kbd">/</kbd>
      </div>
      <div class="topbar-tools">
        <button class="tool-btn" id="settings-btn" title="Filter by contest level &amp; importance" aria-label="Filters"><span class="tb-icon">&#9881;</span><span class="tb-label">Filters</span></button>
        <button class="tool-btn" id="adv-btn" title="Advanced search" aria-label="Advanced search"><span class="tb-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg></span><span class="tb-label">Advanced</span></button>

        <button class="tool-btn" id="lists-btn" title="Your study lists"><span class="tb-icon">&#9733;</span><span class="tb-label">Lists</span></button>
        <button class="tool-btn tool-btn-icon" id="theme-btn" title="Switch to light theme" aria-label="Toggle light or dark theme">&#9790;</button>
      </div>
    </div>
  </header>

  <div class="nav-backdrop" id="nav-backdrop" hidden></div>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>
